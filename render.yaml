# Blueprint de Render: crea la base de datos y el servicio web de una vez.
# En Render: New → Blueprint → conecta este repo.
services:
  - type: web
    name: mala-vida-game
    runtime: node
    plan: free
    # --include=dev es obligatorio: con NODE_ENV=production npm omite las
    # devDependencies, y vite/esbuild/typescript viven ahí. Sin esto el build
    # falla con "vite: not found".
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mala-vida-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_KEY
        sync: false # la defines tú en el panel de Render
      - key: WHATSAPP_NUMBER
        value: '573134966423'
      - key: TIMEZONE
        value: America/Bogota
      - key: GAME_DURATION_SECONDS
        value: '45'
      - key: REWARD_VALID_HOURS
        value: '48'
      - key: GAMES_PER_DAY
        value: '1'
      # URL pública final del juego. Se usa al compilar para que la vista previa
      # del link en WhatsApp muestre el logo. Ej: https://juega.malavida.co
      - key: VITE_PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        value: '*'

databases:
  - name: mala-vida-db
    plan: free
    databaseName: mala_vida
    user: mala_vida
